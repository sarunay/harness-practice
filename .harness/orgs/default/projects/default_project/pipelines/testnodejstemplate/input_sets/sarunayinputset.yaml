inputSet:
  pipeline:
    identifier: testnodejstemplate
    template:
      templateInputs:
        variables:
          - name: IMAGE_REPO
            type: String
            value: ghcr.io/sarunay/harness-practice
          - name: NODE_VERSION
            type: String
            value: "22"
        properties:
          ci:
            codebase:
              connectorRef: githubpoc
              build:
                spec:
                  branch: main
                type: branch
  name: sarunay-input-set
  identifier: sarunayinputset
  orgIdentifier: default
  projectIdentifier: default_project
